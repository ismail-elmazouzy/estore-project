spring.application.name=estore

# ?? MySQL ??????????????????????????????????????
spring.datasource.url=jdbc:mysql://localhost:3306/estore_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ?? JPA ????????????????????????????????????????
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ?? MongoDB ????????????????????????????????????
spring.data.mongodb.uri=mongodb://localhost:27017/estore_reviews

# ?? Fix: JPA + MongoDB conflict ????????????????
spring.data.mongodb.repositories.type=auto
spring.data.jpa.repositories.enabled=true
spring.main.allow-bean-definition-overriding=true

# ?? Server ?????????????????????????????????????
server.port=8080

